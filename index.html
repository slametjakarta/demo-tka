<!DOCTYPE html>
<html lang="id" data-theme="light" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO — Tes Kemampuan Akademik Sekolah</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
/* ══════════════ TEMA NUANSA SEKOLAH ══════════════ */
:root{
  --bg:#FDFBF5;--card:#FFFFFF;--tx:#1F2937;--mut:#6B7280;--bd:#E7E2D5;--bd2:#D6D0BF;
  --pri:#0E7490;--pri-h:#0C5F73;--sec:#0284C7;
  --amb:#EA580C;--amb-bg:#FFF7ED;--amb-bd:#FDBA74;--amb-tx:#9A3412;
  --ok:#16A34A;--err:#DC2626;--tint:#ECFEFF;--soft:#F8F5EC;
  --sh:0 1px 2px rgba(31,41,55,.04),0 1px 3px rgba(31,41,55,.06);
  --sh-lift:0 4px 12px rgba(14,116,144,.1);
  --hf:'Plus Jakarta Sans',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0F172A;--card:#1E293B;--tx:#F1F5F9;--mut:#94A3B8;--bd:#334155;--bd2:#475569;
  --pri:#22D3EE;--pri-h:#06B6D4;--sec:#38BDF8;--amb:#FB923C;--amb-bg:#431407;--amb-bd:#9A3412;--amb-tx:#FED7AA;
  --ok:#4ADE80;--err:#F87171;--tint:#164E63;--soft:#1E293B;--sh:none;--sh-lift:none;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);font-family:var(--bf);font-size:15px;line-height:1.6;margin:0;
  background-image:linear-gradient(rgba(14,116,144,.025) 1px,transparent 1px);background-size:100% 32px;}
[data-theme=dark] body{background-image:linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px);}
h1,h2,h3,h4,h5,.hf{font-family:var(--hf);font-weight:700;color:var(--tx);letter-spacing:-0.01em}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em}
#bar{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pri),var(--sec),var(--amb));z-index:3000;transform:scaleX(0);transform-origin:left;transition:transform .3s;opacity:0}
#bar.on{opacity:1;transform:scaleX(.85)}
#toasts{position:fixed;top:12px;right:12px;z-index:3100;display:flex;flex-direction:column;gap:8px;max-width:340px}
.card-c{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.card-c.soft{background:var(--soft)}
.btn{border-radius:10px;font-weight:600;font-size:14px;transition:transform .12s,box-shadow .12s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--pri);color:#fff;border:1px solid var(--pri);box-shadow:0 2px 0 rgba(14,116,144,.25)}
.btn-pri:hover{background:var(--pri-h);color:#fff;box-shadow:0 3px 0 rgba(14,116,144,.3)}
.btn-sec{background:var(--card);color:var(--tx);border:1px solid var(--bd2)}
.btn-sec:hover{background:var(--soft);color:var(--tx);border-color:var(--pri)}
.btn-ok{background:var(--ok);color:#fff;border:1px solid var(--ok);box-shadow:0 2px 0 rgba(22,163,74,.25)}
.btn-ok:hover{filter:brightness(.94);color:#fff}
.btn-err{background:var(--err);color:#fff;border:1px solid var(--err);box-shadow:0 2px 0 rgba(220,38,38,.25)}
.btn-err:hover{filter:brightness(.94);color:#fff}
.btn-amb{background:transparent;color:var(--amb);border:1.5px solid var(--amb)}
.btn-amb.on{background:var(--amb-bg)}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--mut)}
.btn:focus-visible,.opt:focus-visible,.nav-i:focus-visible{outline:2px solid var(--sec);outline-offset:2px}
.form-control,.form-select{background-color:var(--card);color:var(--tx);border:1.5px solid var(--bd2);border-radius:10px;min-height:44px}
.form-control:focus,.form-select:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(14,116,144,.12);background-color:var(--card);color:var(--tx)}
.form-label{font-size:13px;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--tint);color:var(--pri)}
.chip-mapel{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);color:#5B21B6}
[data-theme=dark] .chip-mapel{background:#3B0764;color:#DDD6FE}
.chip-sd{background:#FEF3C7;color:#92400E}.chip-smp{background:#DBEAFE;color:#1E40AF}
[data-theme=dark] .chip-sd{background:#451A03;color:#FDE68A}
[data-theme=dark] .chip-smp{background:#1E3A8A;color:#BFDBFE}
.badge-pri{display:inline-block;background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:10px;box-shadow:0 2px 6px rgba(14,116,144,.25)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pri);display:flex;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand>i{width:44px;height:44px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;border-radius:12px;font-size:22px;box-shadow:0 3px 8px rgba(14,116,144,.3);position:relative}
.brand>i::after{content:'';position:absolute;bottom:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--sec);border:3px solid var(--card)}
.brand small{display:block;font-size:11px;letter-spacing:.06em;color:var(--mut);font-weight:700;line-height:1.2}
.brand b{font-family:var(--hf);font-size:16px;line-height:1.3}
.login-wrap{max-width:1140px;margin:0 auto;padding:24px 16px}
.hdr-card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 22px;margin-bottom:20px;box-shadow:var(--sh)}
.login-wrap h1{font-size:30px;line-height:1.15;font-weight:800}
.rule{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--sec);border-radius:10px;padding:12px 16px;margin-bottom:10px;font-size:14px;transition:border-color .15s,transform .12s}
.rule:hover{border-left-color:var(--pri);transform:translateX(2px)}
.rule i{color:var(--sec);font-size:20px;flex-shrink:0;margin-top:2px}
.tok-in{font-family:ui-monospace,Consolas,monospace;font-size:24px;letter-spacing:.18em;text-transform:uppercase;text-align:center;font-weight:700;background:var(--soft);border:2px dashed var(--bd2)}
.tok-in:focus{background:var(--card);border-style:solid;border-color:var(--pri)}
.ex-hdr{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:2px solid var(--bd);min-height:64px;box-shadow:0 2px 8px rgba(31,41,55,.04)}
.ex-right{display:flex;align-items:center;gap:12px}
.autosave{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ok);font-weight:600;background:linear-gradient(135deg,#ECFDF5,#D1FAE5);padding:6px 14px;border-radius:20px}
[data-theme=dark] .autosave{background:#064E3B;color:#6EE7B7}
.timer{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--amb-bg),#FED7AA);border:1px solid var(--amb-bd);color:var(--amb-tx);padding:6px 16px;border-radius:12px;box-shadow:0 2px 6px rgba(234,88,12,.15)}
[data-theme=dark] .timer{background:linear-gradient(135deg,#431407,#7C2D12)}
.timer i{font-size:22px}.timer small{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;line-height:1}
.timer b{font-family:var(--hf);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2;font-weight:800}
.timer.low{background:linear-gradient(135deg,#FEE2E2,#FECACA);border-color:#FCA5A5;color:#991B1B;animation:tick 1s infinite}
@keyframes tick{50%{transform:scale(1.02)}}
.ex-body{padding-top:16px;padding-bottom:40px}
.q-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.fs-ctl{display:flex;gap:2px;background:var(--soft);border-radius:10px;padding:3px;border:1px solid var(--bd)}
.fs-ctl button{border:0;background:transparent;color:var(--tx);font-weight:700;padding:2px 12px;border-radius:7px;min-height:32px}
.fs-ctl button:hover{background:var(--card)}
.q-img{max-width:100%;max-height:320px;border:2px solid var(--bd);border-radius:12px;margin-bottom:12px;cursor:zoom-in;display:block;box-shadow:0 4px 12px rgba(31,41,55,.08)}
.q-text{font-size:var(--fs,15px);line-height:1.75;font-weight:500;max-width:840px;margin-bottom:24px;padding:20px 22px;background:var(--card);border-left:5px solid var(--sec);border-radius:0 10px 10px 0;position:relative}
.q-text::before{content:'✏️';position:absolute;top:-14px;left:-18px;font-size:22px;background:var(--card);padding:4px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.opts{display:flex;flex-direction:column;gap:12px;max-width:840px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px 18px;color:var(--tx);font-size:var(--fs,15px);line-height:1.6;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s,transform .1s}
.opt:hover{border-color:var(--sec);box-shadow:var(--sh-lift);transform:translateY(-1px)}
.opt .lt{flex:0 0 36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font-weight:800;font-size:15px;border:2px solid var(--bd)}
.opt.sel{border-color:var(--pri);background:linear-gradient(135deg,var(--tint),#CFFAFE);box-shadow:0 4px 14px rgba(14,116,144,.2)}
.opt.sel .lt{background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;border-color:var(--pri);box-shadow:0 2px 6px rgba(14,116,144,.3)}
[data-theme=dark] .opt.sel{background:linear-gradient(135deg,#164E63,#0E7490)}
.q-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.q-act .btn{min-height:46px;padding:10px 20px;font-weight:700}
.grid-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(min-width:420px){.grid-nav{grid-template-columns:repeat(8,1fr)}}
@media(min-width:992px){.grid-nav{grid-template-columns:repeat(5,1fr)}}
.gn{height:42px;border-radius:10px;border:2px solid var(--bd2);background:var(--card);color:var(--mut);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;transition:transform .1s,box-shadow .1s}
.gn:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(31,41,55,.1)}
.gn.a{background:linear-gradient(135deg,var(--pri),var(--sec));border-color:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(14,116,144,.3)}
.gn.r{background:linear-gradient(135deg,var(--amb),#F59E0B);border-color:var(--amb);color:#fff;box-shadow:0 2px 6px rgba(234,88,12,.3)}
.gn.cur{outline:3px solid var(--sec);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:12px;color:var(--mut)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:6px;vertical-align:-2px;border:2px solid var(--bd2)}
.prog{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,var(--pri),var(--sec));transition:width .3s;border-radius:99px}
.avatar{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;display:grid;place-items:center;font-family:var(--hf);font-weight:800;font-size:20px;flex:0 0 56px;box-shadow:0 4px 10px rgba(14,116,144,.3)}
.score{font-family:var(--hf);font-weight:800;font-size:64px;background:linear-gradient(135deg,var(--pri),var(--sec));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;letter-spacing:-0.02em}
[data-theme=dark] .score{background:linear-gradient(135deg,#22D3EE,#38BDF8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.donut{--p:0;width:140px;height:140px;border-radius:50%;background:conic-gradient(from 0deg,var(--pri) 0%,var(--sec) calc(var(--p)*1%),var(--bd) calc(var(--p)*1%));display:grid;place-items:center;box-shadow:0 6px 20px rgba(14,116,144,.2)}
.donut>div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.2}
.stat{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--sec))}
.stat small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.stat b{font-family:var(--hf);font-size:22px;font-weight:800}
.side{position:fixed;inset:0 auto 0 0;width:252px;background:linear-gradient(180deg,#0F172A,#1E293B);border-right:none;display:flex;flex-direction:column;padding:18px 14px;z-index:60;transition:transform .2s;color:#E2E8F0}
.side .brand>i{background:linear-gradient(135deg,#22D3EE,#38BDF8)}
.side .brand b{color:#fff}.side .brand small{color:#94A3B8}
.nav-i{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:#CBD5E1;padding:11px 14px;border-radius:10px;font-weight:600;margin-bottom:4px;text-align:left;transition:background .15s,color .15s,transform .1s;font-size:14px}
.nav-i i{font-size:18px;width:20px;text-align:center}
.nav-i:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-i.act{background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;box-shadow:0 3px 10px rgba(34,211,238,.35)}
.side .text-secondary{color:#94A3B8!important}
.side .border-top{border-color:rgba(255,255,255,.1)!important}
.main{margin-left:252px;min-height:100vh}
.mtop{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--bd);padding:14px 24px;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(31,41,55,.04)}
.mtop h2{font-size:20px;margin:0;font-weight:800}
.pg{padding:22px 24px 40px}
.kpi{padding:18px 20px;border-radius:14px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--sec));opacity:.06}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.kpi b{font-family:var(--hf);font-size:34px;color:var(--pri);line-height:1.1;font-variant-numeric:tabular-nums;font-weight:800}
[data-theme=dark] .kpi b{color:var(--tx)}
.kpi span{font-size:12px;color:var(--mut)}
.live{display:inline-flex;gap:8px;align-items:center;background:linear-gradient(135deg,#ECFDF5,#D1FAE5);color:#047857;font-weight:700;font-size:12px;padding:6px 14px;border-radius:99px}
[data-theme=dark] .live{background:#064E3B;color:#6EE7B7}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 0 rgba(16,185,129,.7);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.tbl{width:100%;font-size:14px;border-collapse:separate;border-spacing:0}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:var(--soft);padding:12px 14px;white-space:nowrap}
.tbl th:first-child{border-radius:10px 0 0 10px}
.tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{padding:12px 14px;border-top:1px solid var(--bd);vertical-align:middle}
.tbl tr:hover td{background:var(--soft)}
.st{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px}
.st.Selesai{background:#DCFCE7;color:#166534}.st.Sedang{background:#DBEAFE;color:#1E40AF}.st.Belum{background:var(--bd);color:var(--mut)}
[data-theme=dark] .st.Selesai{background:#14351F;color:#86EFAC}
[data-theme=dark] .st.Sedang{background:#172554;color:#93C5FD}
.rank{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font-weight:800;font-size:13px}
.rank.top{background:linear-gradient(135deg,#F59E0B,#EA580C);color:#fff;box-shadow:0 2px 6px rgba(234,88,12,.3)}
.tw{overflow-x:auto}
.alert-info{background:linear-gradient(135deg,#ECFEFF,#CFFAFE);border:1px solid #A5F3FC;color:#155E75;border-radius:10px}
[data-theme=dark] .alert-info{background:#164E63;border-color:#0E7490;color:#CFFAFE}
.demo-tag{position:fixed;bottom:12px;right:12px;z-index:9999;background:linear-gradient(135deg,var(--amb),#F59E0B);color:#fff;font-weight:700;font-size:12px;padding:6px 14px;border-radius:99px;box-shadow:0 4px 12px rgba(234,88,12,.4)}
.demo-tag i{margin-right:6px}
.side .mt-auto{padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.scrim{display:none}
@media(max-width:991px){
  .side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .side.open~.scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:55}
  .main{margin-left:0}.mtop{padding:12px 14px}.pg{padding:16px 12px 32px}
  .ex-hdr{padding:8px 12px}.autosave{display:none}.timer b{font-size:18px}
  .login-wrap h1{font-size:24px}.score{font-size:48px}
  .donut{width:110px;height:110px}.donut>div{width:82px;height:82px}.kpi b{font-size:28px}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="toasts" aria-live="polite"></div>
<div id="app"></div>
<div class="demo-tag"><i class="bi bi-info-circle-fill"></i> MODE DEMO — Data tidak tersimpan</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
'use strict';
/* ============ UTIL ============ */
const L = ['A', 'B', 'C', 'D', 'E'];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const hms = s => pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
const S = { tok: null, u: null, page: '', mon: null, mp: 1, pp: 1, sp: 1, peserta: null, soal: null, at: null, peran: null, nama: '', pall: false };
const T = { poll: null, tick: null, save: null };
let busy = 0, modal = null, chart = null;

function clearT() { Object.keys(T).forEach(k => { clearInterval(T[k]); clearTimeout(T[k]); T[k] = null; }); }
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast align-items-center text-bg-' + (type || 'primary') + ' border-0';
  el.innerHTML = '<div class="d-flex"><div class="toast-body">' + esc(msg) + '</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
  $('#toasts').appendChild(el);
  el.addEventListener('hidden.bs.toast', () => el.remove());
  new bootstrap.Toast(el, { delay: 3500 }).show();
}
function bar(d) { busy += d; $('#bar').classList.toggle('on', busy > 0); }
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t); document.documentElement.setAttribute('data-bs-theme', t);
  try { localStorage.setItem('cbt_theme', t); } catch (e) { }
  if (chart && S.mon) { chart.destroy(); chart = null; drawMon(); }
}
function toggleTheme() { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
function showModal(title, body, footer, o) {
  o = o || {};
  $('#modT').textContent = title; $('#modB').innerHTML = body; $('#modF').innerHTML = footer || '';
  $('#modF').style.display = footer ? '' : 'none';
  $('#modDlg').className = 'modal-dialog modal-dialog-centered modal-dialog-scrollable' + (o.size ? ' modal-' + o.size : '');
  if (!modal) {
    // Modal HTML belum ada — buat sekali

  });
  return o;
}

  resetToken: (t, id) => { const p = DB.peserta.find(x => x.id === id); const nt = 'TKA-' + Math.random().toString(36).slice(2, 8).toUpperCase(); if (p) p.token = nt; return { success: true, data: { token: nt }, message: 'Token baru diterbitkan.' }; },

};

async function loginPeserta(e) {
  e.preventDefault();
  const tok = $('#tok').value.trim().toUpperCase();
  if (!tok) { toast('Masukkan token ujian Anda.', 'warning'); return; }
  const b = $('#btnMulai'); loadingBtn(b, 'Memverifikasi...');
  const r = await api('mulaiUjian', [tok]);
  resetBtn(b);
  if (!r.success) { toast(r.message, 'danger'); return; }
  S.tok = tok;
  startUjian(r.data);
}
function startUjian(d) {
  clearT();
  S.u = { soal: d.soal, a: {}, r: new Set(), i: 0, sisa0: d.sisaMs, t0: performance.now(), ver: 0, sv: 0, p: d.peserta, nama: d.namaUjian, fs: 15, ending: false, selesai: false, v: 0, maks: d.maks || 0 };
  viewUjian();
  T.tick = setInterval(tick, 1000);
  tick();
}
function viewUjian() {
  const u = S.u, ini = u.p.nama.split(' ').slice(0, 2).map(x => x[0]).join('').toUpperCase();
  $('#app').innerHTML = `
  <div class="ex-hdr">

    </div>
  </div>
  <div class="container-xl ex-body"><div class="row g-3">
    <div class="col-lg-8" id="qCol"></div>
    <div class="col-lg-4">

          <small class="d-block">Kelas: <b>${esc(u.p.kelas)}</b> · Jenjang: <b>${esc(u.p.jenjang)}</b></small>
          <small class="text-secondary d-block">${esc(u.p.sekolah || '')}</small>

      <div class="card-c soft p-3 small"><i class="bi bi-shield-check" style="color:var(--pri)"></i> <b>Demo:</b> soal &amp; kunci diacak dari bank soal contoh sesuai jenjang Anda.</div>
    </div>
  </div></div>`;
  renderSoal();
}
function renderSoal() {
  const u = S.u, q = u.soal[u.i], n = u.soal.length, sel = u.a[q.id], rg = u.r.has(q.id);
  const opts = q.o.map((o, k) => o == null || o === '' ? '' : `<button type="button" class="opt ${sel === L[k] ? 'sel' : ''}" onclick="pilih('${L[k]}')"><span class="lt">${L[k]}</span><span>${esc(o)}</span></button>`).join('');
  $('#qCol').innerHTML = `
  <div class="card-c p-3 p-md-4" style="--fs:${u.fs}px">
    <div class="q-top"><span class="badge-pri tnum">Soal No. ${u.i + 1} dari ${n}</span>
      <span class="chip chip-mapel"><i class="bi bi-book"></i> ${esc(q.m || 'Umum')}</span>
      <span class="chip ${q.j === 'SD' ? 'chip-sd' : 'chip-smp'}">${esc(q.j || '')}</span>
      <span class="chip">${esc(q.k || 'Umum')}</span><span class="chip">Bobot: ${q.b}</span>
      <div class="fs-ctl ms-auto"><button onclick="fsz(-1)">A-</button><button onclick="fsz(0)">A</button><button onclick="fsz(2)">A+</button></div></div>
    <p class="q-text">${esc(q.t).replace(/\n/g, '<br>')}</p>
    <div class="opts">${opts}</div>
    <div class="q-act">
      <button class="btn btn-sec" ${u.i === 0 ? 'disabled' : ''} onclick="nav(-1)"><i class="bi bi-chevron-left"></i> Sebelumnya</button>
      <button class="btn btn-amb ${rg ? 'on' : ''}" onclick="ragu()"><i class="bi bi-bookmark${rg ? '-fill' : ''}"></i> Tandai Ragu-ragu</button>
      <button class="btn btn-pri" ${u.i === n - 1 ? 'disabled' : ''} onclick="nav(1)">Lanjutkan <i class="bi bi-chevron-right"></i></button>
      <button class="btn btn-err ms-md-auto" onclick="konfirmasiSelesai()"><i class="bi bi-check2-all"></i> Selesaikan Tes</button>
    </div>
  </div>`;
  renderMap();
}
function renderMap() {
  const u = S.u, n = u.soal.length; let a = 0, r = 0;
  const cells = u.soal.map((q, i) => { const an = !!u.a[q.id], rg = u.r.has(q.id); if (an) a++; if (rg) r++; return `<button class="gn ${rg ? 'r' : an ? 'a' : ''} ${i === u.i ? 'cur' : ''}" onclick="gotoQ(${i})">${pad(i + 1)}</button>`; }).join('');
  $('#mapCard').innerHTML = `<div class="d-flex justify-content-between align-items-end mb-2"><h5 class="mb-0 fs-6">Peta Kisi Soal</h5><span class="tnum"><b>${a}</b>/${n} <small class="text-secondary">terjawab</small></span></div>
    <div class="prog mb-3"><div style="width:${n ? a / n * 100 : 0}%"></div></div><div class="grid-nav">${cells}</div>
    <div class="legend"><span><i style="background:linear-gradient(135deg,var(--pri),var(--sec))"></i>Terjawab (${a})</span><span><i style="background:var(--amb)"></i>Ragu-ragu (${r})</span><span><i style="background:var(--card)"></i>Belum (${n - a})</span></div>`;
}
function pilih(l) { const u = S.u, q = u.soal[u.i]; if (u.ending) return; u.a[q.id] = l; markDirty(); renderSoal(); }
function ragu() { const u = S.u, id = u.soal[u.i].id; if (u.r.has(id)) u.r.delete(id); else u.r.add(id); markDirty(); renderSoal(); }
function nav(d) { const u = S.u; u.i = Math.max(0, Math.min(u.soal.length - 1, u.i + d)); renderSoal(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function gotoQ(i) { S.u.i = i; renderSoal(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function fsz(d) { const u = S.u; u.fs = d === 0 ? 15 : Math.max(13, Math.min(22, u.fs + d)); renderSoal(); }
function setAuto(txt) { const a = $('#auto'); if (a) a.innerHTML = '<i class="bi bi-cloud-check" style="color:var(--ok)"></i><span>' + txt + '</span>'; }
function markDirty() { setAuto('Menyimpan...'); clearTimeout(T.save); T.save = setTimeout(() => setAuto('Tersimpan ' + new Date().toLocaleTimeString('id-ID')), 800); }
function tick() {
  const u = S.u; if (!u) return;
  const ms = u.sisa0 - (performance.now() - u.t0), s = Math.max(0, Math.ceil(ms / 1000));
  const t = $('#tmr'); if (t) t.textContent = hms(s);
  const tm = $('#timer'); if (tm) tm.classList.toggle('low', s < 600);
  if (ms <= 0 && !u.ending && !u.selesai) { u.ending = true; akhiri(true); }
}
function konfirmasiSelesai() {
  const u = S.u, n = u.soal.length, a = u.soal.filter(q => u.a[q.id]).length, r = u.r.size;
  confirmBox('Selesaikan Tes?', `<p>Anda telah menjawab <b>${a}</b> dari <b>${n}</b> soal.</p>${n - a ? `<div class="alert alert-warning py-2"><b>${n - a}</b> soal belum dijawab.</div>` : ''}${r ? `<div class="alert alert-warning py-2"><b>${r}</b> soal masih bertanda ragu-ragu.</div>` : ''}<p class="mb-0">Setelah dikumpulkan, jawaban <b>tidak dapat diubah</b>.</p>`, 'Ya, Kumpulkan', 'btn-ok', () => { loadingBtn($('#cfOk'), 'Mengumpulkan...'); akhiri(false); });
}
async function akhiri() {
  const u = S.u; u.ending = true; clearTimeout(T.save);
  const r = await api('akhiriUjian', [S.tok, u.a, Array.from(u.r), u.v]);
  if (r.success) { u.selesai = true; clearT(); hideModal(); viewHasil(r.data); }
  else { u.ending = false; toast(r.message, 'danger'); }
}

    <div class="col-6 col-md-3"><select id="mS" class="form-select" onchange="S.mp=1;drawMon()"><option value="">Semua Status</option><option>Belum</option><option>Sedang</option><option>Selesai</option></select></div></div></div>
  <div class="row g-3">
    <div class="col-xl-8"><div class="card-c"><div class="tw"><table class="tbl"><thead><tr><th>Rank</th><th>Peserta &amp; NISN</th><th>Kelas / Jenjang</th><th>Status</th><th>Kemajuan</th><th class="text-end">Nilai</th></tr></thead><tbody id="mBody"></tbody></table></div>
      <div class="d-flex justify-content-between align-items-center p-3 border-top flex-wrap gap-2" id="mPag"></div></div></div>
    <div class="col-xl-4"><div class="card-c p-3 mb-3"><h5 class="fs-6">Distribusi Nilai</h5><div style="height:190px"><canvas id="mChart"></canvas></div><div id="mLulus" class="mt-3"></div></div>
      <div class="card-c p-3"><h5 class="fs-6">Statistik per Mata Pelajaran</h5><div id="mForm"></div></div></div>
  </div>`;
  loadMon(); T.poll = setInterval(loadMon, 5000);
}
async function loadMon() {
  if (S.page !== 'mon') return;
  const r = await api('ambilMonitoring');
  if (!r.success || S.page !== 'mon') return;
  S.mon = r.data; drawMon();
}
function monFiltered() {
  const q = ($('#mQ').value || '').toLowerCase(), j = $('#mJ').value, s = $('#mS').value;
  return S.mon.list.filter(x => (!q || x.nama.toLowerCase().includes(q) || x.nisn.includes(q)) && (!j || x.jenjang === j) && (!s || x.st === s));
}
function drawMon() {
  const d = S.mon; if (!d || S.page !== 'mon') return; const k = d.kpi;
  $('#mTs').textContent = new Date(d.ts).toLocaleTimeString('id-ID');
  $('#mKpi').innerHTML = [['Total Peserta', k.total, 'Terdaftar'], ['Sedang Mengerjakan', k.sedang, 'Sesi aktif'], ['Telah Selesai', k.selesai, 'Nilai tercatat'], ['Rata-rata', k.rata, 'Max ' + k.max + ' · Min ' + k.min]]
    .map(x => `<div class="col-6 col-xl-3"><div class="card-c kpi"><small>${x[0]}</small><b>${x[1]}</b><br><span>${x[2]}</span></div></div>`).join('');
  const f = monFiltered(), per = 15; S.mp = pager('#mPag', S.mp, f.length, per, 'monPage');
  $('#mBody').innerHTML = f.slice((S.mp - 1) * per, S.mp * per).map(x => `<tr>
    <td>${x.rank ? `<span class="rank ${x.rank <= 3 ? 'top' : ''}">${x.rank}</span>` : '–'}</td>
    <td><b>${esc(x.nama)}</b><br><small class="text-secondary tnum">${esc(x.nisn)}</small></td>
    <td><span class="chip">${esc(x.kelas || '')}</span> <span class="chip ${x.jenjang === 'SD' ? 'chip-sd' : 'chip-smp'}">${esc(x.jenjang)}</span><br><small class="text-secondary">${esc(x.sekolah || '')}</small></td>
    <td><span class="st ${x.st}">${x.st === 'Sedang' ? 'Mengerjakan' : x.st}</span></td>
    <td><small class="tnum">${x.dj}/${x.tot}</small><div class="prog mt-1"><div style="width:${x.tot ? x.dj / x.tot * 100 : 0}%"></div></div></td>
    <td class="text-end"><b class="tnum" style="${x.st === 'Selesai' && x.nilai < d.pg ? 'color:var(--err)' : ''}">${x.nilai != null ? x.nilai.toFixed(2) : '–'}</b></td></tr>`).join('') || '<tr><td colspan="6" class="text-center text-secondary py-4">Belum ada data.</td></tr>';
  const dark = document.documentElement.getAttribute('data-theme') === 'dark', labels = ['<60', '60-69', '70-79', '80-89', '≥90'];
  if (chart) { chart.data.datasets[0].data = d.dist; chart.update(); }
  else if ($('#mChart')) chart = new Chart($('#mChart'), { type: 'bar', data: { labels, datasets: [{ data: d.dist, backgroundColor: ['#67E8F9', '#22D3EE', '#0E7490', '#155E75', '#083344'], borderRadius: 6 }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0, color: dark ? '#94A3B8' : '#64748B' }, grid: { color: dark ? '#334155' : '#E7E2D5' } }, x: { ticks: { color: dark ? '#94A3B8' : '#64748B' }, grid: { display: false } } } } });
  $('#mLulus').innerHTML = `<div class="d-flex justify-content-between small"><span>Lolos ambang batas (≥ ${d.pg})</span><b style="color:var(--ok)">${k.lulus} peserta</b></div><div class="d-flex justify-content-between small"><span>Di bawah ambang batas</span><b style="color:var(--err)">${k.tidak} peserta</b></div>`;
  const jabs = Object.keys(d.formasi).sort();
  $('#mForm').innerHTML = jabs.map(m => { const v = d.formasi[m]; return `<div class="mb-3"><div class="d-flex justify-content-between small"><b>${esc(m)}</b><span style="color:var(--sec)">Rata: ${v.rata}</span></div><div class="prog my-1"><div style="width:${v.sel ? v.lulus / v.sel * 100 : 0}%"></div></div><small class="text-secondary">Peserta: ${v.pel} · Selesai: ${v.sel} · Lulus: ${v.lulus}</small></div>`; }).join('') || '<small class="text-secondary">Belum ada data. Selesaikan tes sebagai peserta untuk melihat statistik.</small>';
}
function monPage(p) { S.mp = p; drawMon(); }

/* ── Rekap ── */
async function pgRekap() {
  $('#pg').innerHTML = `<div class="card-c p-4" style="max-width:760px"><h4>Rekapitulasi Hasil Tes</h4>
    <p class="text-secondary">Di produksi, tombol di bawah akan menghasilkan PDF urut peringkat. Di demo, fitur ini dinonaktifkan.</p>
    <div class="alert alert-info"><i class="bi bi-info-circle"></i> Buka versi produksi (Apps Script) untuk mengunduh PDF.</div>
    <button class="btn btn-pri" onclick="toast('Fitur PDF hanya di mode produksi.','warning')"><i class="bi bi-file-earmark-pdf"></i> Buat PDF (dinonaktifkan)</button></div>`;
}

    <p class="text-secondary">Di produksi, data terisi otomatis dari sistem.</p>
    <div class="row g-3">

/* ── Peserta ── */
function pgPeserta() {
  $('#pg').innerHTML = `
  <div class="d-flex flex-wrap gap-2 mb-3">
    <button class="btn btn-pri" onclick="toast('Di produksi: impor Excel peserta.','warning')"><i class="bi bi-upload"></i> Impor Peserta</button>
    <button class="btn btn-sec" onclick="toast('Di produksi: unduh template Excel.','warning')"><i class="bi bi-file-earmark-excel"></i> Template</button>
  </div>
  <div class="row g-3 mb-3" id="pKpi"></div>
  <div class="card-c p-3 mb-3"><input id="pQ" class="form-control" placeholder="Cari nama, NISN, atau token..." oninput="S.pp=1;drawPeserta()"></div>
  <div class="card-c"><div class="tw"><table class="tbl"><thead><tr><th>ID</th><th>Identitas Siswa</th><th>Kelas / Jenjang</th><th>Sekolah</th><th>Token</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="pBody"></tbody></table></div>
    <div class="d-flex justify-content-between align-items-center p-3 border-top flex-wrap gap-2" id="pPag"></div></div>`;
  loadPeserta();
}
async function loadPeserta() {
  const r = await api('ambilPeserta'); if (!r.success || S.page !== 'peserta') return;
  S.peserta = r.data; drawPeserta();
}
function drawPeserta() {
  const a = S.peserta; if (!a || S.page !== 'peserta') return;
  const c = x => a.filter(p => p.st === x).length;
  const sd = a.filter(p => p.jenjang === 'SD').length, smp = a.filter(p => p.jenjang === 'SMP').length;
  $('#pKpi').innerHTML = [['Total Peserta', a.length], ['Jenjang SD', sd], ['Jenjang SMP', smp], ['Selesai', c('Selesai')]].map(x => `<div class="col-6 col-lg-3"><div class="card-c kpi"><small>${x[0]}</small><b>${x[1]}</b></div></div>`).join('');
  const q = ($('#pQ').value || '').toLowerCase();
  const f = a.filter(p => !q || (p.nama + p.nisn + p.token).toLowerCase().includes(q)), per = 20;
  S.pp = pager('#pPag', S.pp, f.length, per, 'pesPage');
  $('#pBody').innerHTML = f.slice((S.pp - 1) * per, S.pp * per).map(p => `<tr>
    <td class="tnum">${esc(p.id)}</td>
    <td><b>${esc(p.nama)}</b><br><small class="text-secondary tnum">NISN: ${esc(p.nisn)}</small></td>
    <td><span class="chip">${esc(p.kelas)}</span> <span class="chip ${p.jenjang === 'SD' ? 'chip-sd' : 'chip-smp'}">${esc(p.jenjang)}</span></td>
    <td><small>${esc(p.sekolah)}</small></td>
    <td><b class="mono">${esc(p.token)}</b></td>
    <td><span class="st ${esc(p.st)}">${esc(p.st)}</span></td>
    <td><button class="btn btn-sec btn-sm" onclick="resetTok('${esc(p.id)}','${esc(p.nama)}')"><i class="bi bi-key"></i></button></td></tr>`).join('');
}
function pesPage(p) { S.pp = p; drawPeserta(); }
function resetTok(id, nama) {
  confirmBox('Reset Token', `Terbitkan token baru untuk <b>${nama}</b>?`, 'Terbitkan', 'btn-amb', async () => {
    const r = await api('resetToken', [S.at, id]);
    if (r.success) { hideModal(); toast('Token baru: ' + r.data.token, 'success'); loadPeserta(); }
  });
}

/* ── Bank Soal ── */
function pgSoal() {
  $('#pg').innerHTML = `
  <div class="row g-3 mb-3" id="sKpi"></div>
  <div class="card-c p-3 mb-3"><div class="d-flex flex-wrap gap-2">
    <input id="sQ" class="form-control" style="flex:1 1 220px;max-width:420px" placeholder="Cari soal atau mapel..." oninput="S.sp=1;drawSoal()">
    <button class="btn btn-pri" onclick="toast('Di produksi: impor Excel bank soal.','warning')"><i class="bi bi-upload"></i> Impor Excel</button>
    <button class="btn btn-sec" onclick="toast('Di produksi: tambah soal manual.','warning')"><i class="bi bi-plus-circle"></i> Tambah Soal</button></div></div>
  <div class="card-c"><div class="tw"><table class="tbl"><thead><tr><th>ID</th><th>Mapel / Jenjang</th><th>Teks Soal</th><th>Kunci</th><th>Bobot</th></tr></thead><tbody id="sBody"></tbody></table></div>
    <div class="d-flex justify-content-between align-items-center p-3 border-top flex-wrap gap-2" id="sPag"></div></div>`;
  drawSoal();
}
function drawSoal() {
  const a = DB.bank;
  const mapelSet = new Set(a.map(x => x.m));
  $('#sKpi').innerHTML = [['Total Soal', a.length], ['Mata Pelajaran', mapelSet.size], ['Soal SD', a.filter(x => x.j === 'SD').length], ['Soal SMP', a.filter(x => x.j === 'SMP').length]].map(x => `<div class="col-6 col-lg-3"><div class="card-c kpi"><small>${x[0]}</small><b>${x[1]}</b></div></div>`).join('');
  const q = ($('#sQ').value || '').toLowerCase(), f = a.filter(x => !q || (x.id + x.t + x.m).toLowerCase().includes(q)), per = 10;
  S.sp = pager('#sPag', S.sp, f.length, per, 'soalPage');
  $('#sBody').innerHTML = f.slice((S.sp - 1) * per, S.sp * per).map(x => `<tr>
    <td class="tnum"><b>${esc(x.id)}</b></td>
    <td><span class="chip chip-mapel">${esc(x.m)}</span> <span class="chip ${x.j === 'SD' ? 'chip-sd' : 'chip-smp'}">${esc(x.j)}</span><br><small class="text-secondary">${esc(x.k)}</small></td>
    <td style="max-width:340px">${esc(x.t)}</td>
    <td><b style="color:var(--ok)">${esc(x.kunci)}</b></td><td class="tnum">${x.b}</td></tr>`).join('');
}
function soalPage(p) { S.sp = p; drawSoal(); }

      <div class="col-md-6"><label class="form-label">Paket Mapel SD</label><input class="form-control" value="${esc(s.Paket_Mapel_SD)}"></div>
